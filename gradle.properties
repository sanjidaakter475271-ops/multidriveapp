# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the Gradle Daemon.
# The setting is particularly useful for tweaking memory settings.
# Increase heap to prevent GC thrashing during large Compose + Hilt builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel project execution
org.gradle.parallel=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable Kotlin incremental compilation
kotlin.incremental=true

# AndroidX
android.useAndroidX=true

# Jetifier: auto-migrates third-party legacy support library dependencies to AndroidX
android.enableJetifier=true

# Suppress deprecated kotlin-kapt usage warnings
kapt.use.worker.api=false
